repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-yaml
      - id: check-toml
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # pass_filenames: false -> mypy uses the `files` list from pyproject.toml,
        # so pre-commit, CI and manual runs all check the identical file set.
        pass_filenames: false
        additional_dependencies:
          - faker>=30
          - pydantic>=2.11,<3
          - pytest>=8.3,<9
          - types-requests>=2.32
          - urllib3>=2
